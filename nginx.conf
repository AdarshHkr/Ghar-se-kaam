user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    sendfile        on;
    keepalive_timeout  65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline' 'unsafe-eval'" always;

    # 1. Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name gharsekaam.xyz www.gharsekaam.xyz;
        return 301 https://$host$request_uri;
    }

    # 2. Main HTTPS Server
    server {
        listen 443 ssl;
        server_name gharsekaam.xyz www.gharsekaam.xyz;

        # SSL Certificates (Certbot will manage these)
        ssl_certificate /etc/letsencrypt/live/gharsekaam.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/gharsekaam.xyz/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://app:3000;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for video streaming
            proxy_read_timeout 86400;
        }
    }
}